<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2F5BFF"><title>UniSide</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="description" content="Find squads, partners and a marketplace at your college."><meta property="og:title" content="UniSide"><meta property="og:description" content="Find squads, partners and a marketplace at your college."><meta property="og:image" content="https://uniside-app.netlify.app/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#fff;--ink:#14182B;--mute:#6B7288;--line:#E1E5EE;--blue:#2F5BFF;--lime:#C8F169;--red:#D93B4A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1220;--card:#181C30;--ink:#EEF0F8;--mute:#9AA1BA;--line:#2A2F4A}}
:root[data-theme="dark"]{--bg:#0F1220;--card:#181C30;--ink:#EEF0F8;--mute:#9AA1BA;--line:#2A2F4A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding:16px 16px 90px;min-height:100vh}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:20px;font-weight:800;margin:0 0 12px}
p.sub{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2.5px solid var(--blue);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:14px;margin-top:20px;cursor:pointer}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;margin:0;font-size:14px;border-radius:99px}
.btn.alt{background:var(--lime);color:#14182B}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.no{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--lime);color:#14182B;display:grid;place-items:center;font-weight:800;object-fit:cover;flex:none}
.sq-h{display:flex;gap:12px;align-items:center}
.emo{width:46px;height:46px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:24px;flex:none}
.sq-t{font-weight:800;font-size:17px}
.meta{color:var(--mute);font-size:14px;margin:2px 0}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--blue)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;font-weight:600;color:var(--mute)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:480px;width:100%}
.nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;font-weight:600;padding:10px 0 12px;cursor:pointer}
.nav button.on{color:var(--blue)}
.nav b{display:block;font-size:20px}
.dot{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:3px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0;min-height:45vh}
.m{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:15px}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}
.m small{display:block;font-size:11px;opacity:.7;font-weight:600}
.m.sys{align-self:center;background:none;border:0;color:var(--mute);font-size:13px}
.send{position:sticky;bottom:70px;display:flex;gap:8px;background:var(--bg);padding:8px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.photo{display:flex;align-items:center;gap:12px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:800;padding:10px;border-radius:11px;cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
.sub2{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.sub2 .chip{font-size:13px;padding:6px 12px}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:40vh auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head><body><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,deleteUser,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,onSnapshot,query,where,orderBy,writeBatch,arrayUnion,getDocs,deleteDoc,limit,startAfter,increment,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
window.__err=m=>{let b=document.getElementById('dbg');if(!b){b=document.createElement('div');b.id='dbg';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#D93B4A;color:#fff;padding:8px 12px;font:12px/1.4 system-ui;word-break:break-word';b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent='Error: '+m+' (tap to close)'};
const ce=console.error;console.error=(...a)=>{ce(...a);try{window.__err(a.map(x=>x&&x.message?x.message:String(x)).join(' '))}catch(e){}};
window.addEventListener('error',e=>window.__err(e.message));window.addEventListener('unhandledrejection',e=>window.__err((e.reason&&e.reason.message)||e.reason));
const fb=initializeApp({apiKey:"AIzaSyB7Gf4UvO8gp7Rbk-7Ze0F7FnD458Z2Phg",authDomain:"felloup.firebaseapp.com",projectId:"felloup",storageBucket:"felloup.firebasestorage.app",messagingSenderId:"449950606513",appId:"1:449950606513:web:fca71e0e85230a34e06e90"});
const auth=getAuth(fb),db=getFirestore(fb),app=document.getElementById('app');
const COLLEGES=['IIT Patna','NIT Patna','AIIMS Patna'];
const GROUPS={Sports:[['Football','⚽'],['Cricket','🏏'],['Basketball','🏀'],['Badminton','🏸'],['Table Tennis','🏓'],['Volleyball','🏐'],['Running','🏃'],['Cycling','🚴'],['Athletics','🏅'],['Swimming','🏊'],['Yoga','🧘'],['Chess','♟️'],['Gym','🏋️']],Creative:[['Photography','📷'],['Music','🎵'],['Dance','💃'],['Singing','🎤'],['Video Editing','🎞️'],['Graphic Design','🖌️'],['Animation','🎬'],['Art','🎨'],['Writing','✍️'],['Drama and Theatre','🎭']],Social:[['Movies','🎬'],['Food and Cafes','🍕'],['Mall Outing','🛍️'],['Bike Ride','🏍️'],['Walk and Talk','🚶'],['Trips and Treks','⛰️'],['Gaming','🎮'],['Events and Fests','🎉'],['Hangout','☕']],Growth:[['Coding','💻'],['Study','📚'],['Startups','🚀'],['Product Building','🧩'],['Public Speaking','🎙️'],['Placement Prep','💼'],['Language Practice','🗣️']]};
const ACTS=Object.values(GROUPS).flat();
const EMO=Object.fromEntries(ACTS);
const AUD={both:'Everyone',women:'Women only',men:'Men only'};
const H=36e5,D=864e5;
const at=(d,h,m)=>{const x=new Date();x.setDate(x.getDate()+d);x.setHours(h,m,0,0);return x.getTime()};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const lt=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmt=ts=>{const d=new Date(ts),n=new Date(),t=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}),df=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/D);return (df===0?'Today':df===1?'Tomorrow':d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}))+', '+t};
const NAMES=['Aman','Riya','Kabir','Sneha','Rohan','Tanvi'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let U=null,squads=[],inR=[],outR=[],chat=[],items=[],people=[],home='squads',cat='All',peopleOnly=true,chatPath=[],chatTitle='',chatSub='',tab='today',only=true,v='auth',chatId=null,draft={interests:[],photo:''},creating=0,un=[],unChat=null;
const avatar=u=>u.photo?`<img class="av" src="${u.photo}" alt="">`:`<div class="av">${esc(u.name[0]||'?')}</div>`;

const sq=id=>squads.find(s=>s.id===id);
const errMsg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'This email already has an account. Log in instead.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email.','auth/network-request-failed':'No internet connection.'})[e.code]||(console.error(e),'Something went wrong. Try again.');
const go=x=>{v=x;render();window.scrollTo(0,0)};
const refresh=()=>{syncMeta();if(['home','alerts','chat','market','chats','prof'].includes(v))render()};
function render(){
  if(booting){app.innerHTML='<div class="spin"></div>';return}
  const m=document.getElementById('msg'),mv=m?m.value:'',foc=m&&document.activeElement===m;
  app.innerHTML=({auth:vAuth,signup:vSignup,home:vHome,create:vCreate,alerts:vAlerts,profile:vProfile,chat:vChat,market:vMarket,sell:vSell,chats:vChats,prof:vProf,intro:vIntro,edit:vEdit})[v]()+(U&&!['chat','intro'].includes(v)?nav():'');
  if(v==='chat'){const n=document.getElementById('msg');if(n&&mv)n.value=mv;if(n&&foc)n.focus();const l=document.querySelector('.msgs');l&&l.lastElementChild&&l.lastElementChild.scrollIntoView()}
}
function nav(){
  const n=inR.filter(r=>r.status==='pending').length;
  const t=(k,i,l)=>`<button class="${v===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='alerts'&&n?`<span class="dot">${n}</span>`:''}</button>`;
  return `<div class="nav"><div>${t('home','🏠','Home')}${t('create','➕','Squad')}${t('market','🛍️','Market')}${t('alerts','🔔','Alerts')}${t('profile','👤','Me')}</div></div>`;
}
function chips(sel,fn){return Object.entries(GROUPS).map(([g,l])=>`<div class="meta" style="margin:12px 0 6px;font-weight:600">${g}</div><div class="chips">${l.map(([n,e])=>`<button type="button" class="chip ${sel.includes(n)?'on':''}" onclick="${fn}('${n}')">${e} ${n}</button>`).join('')}</div>`).join('')}

/* AUTH */
onAuthStateChanged(auth,async u=>{
  if(creating)return;
  if(!u){U=null;un.forEach(f=>f());un=[];Object.values(metaUn).forEach(f=>f());metaUn={};meta={};booting=false;v='auth';render();return}
  try{const d=await getDoc(doc(db,'users',u.uid));
    if(d.exists()){U={...d.data(),uid:u.uid};start();v=ls.get('intro')?'home':'intro'}else v='signup'}catch(e){console.error(e);v='auth'}
  booting=false;render();
});
function start(){
  un.forEach(f=>f());un=[];loadPeople(true);
  const now=Date.now(),w=wk(now),m=Math.floor(now/2592e6);
  watch('squads','wk',[w,w+1],a=>squads=a.filter(s=>nb(s.creator)));watch('items','mk',[m,m-1],a=>items=a.filter(i=>nb(i.seller)));
  un.push(onSnapshot(query(collection(db,'requests'),where('creator','==',U.uid)),s=>{inR=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>nb(r.uid));refresh()}),
  onSnapshot(query(collection(db,'requests'),where('uid','==',U.uid)),s=>{outR=s.docs.map(d=>({id:d.id,...d.data()}));refresh()}));
}
function vAuth(){return `<h1>UniSide</h1><p class="sub">Find your squad on campus.</p>
  <label>Email</label><input id="a-mail" type="email" autocomplete="email"><label>Password <a href="#" style="font-weight:400;float:right" onclick="event.preventDefault();tp('a-pw')">Show</a></label><input id="a-pw" type="password" autocomplete="current-password">
  <div class="err" id="err"></div><button class="btn" onclick="login()">Log in</button><button class="btn ghost" style="border:0;margin-top:6px" onclick="resetPw()">Forgot password?</button><button class="btn ghost" onclick="draft.interests=[];go('signup')">Create new account</button>${dip?'<button class="btn alt" onclick="installApp()">Install app</button>':''}${legal()}`}
async function login(){const e=document.getElementById('err');try{await signInWithEmailAndPassword(auth,document.getElementById('a-mail').value.trim(),document.getElementById('a-pw').value)}catch(x){e.textContent=errMsg(x)}}
function vSignup(){const d=draft;return `<h1>UniSide</h1><p class="sub">Create your account. It takes one minute.</p>
  <div class="photo">${d.photo?`<img class="av" src="${d.photo}" alt="">`:'<div class="av">+</div>'}<label style="margin:0;cursor:pointer;color:var(--blue)">Add profile photo<input type="file" accept="image/*" hidden onchange="pic(this)"></label></div>
  <label>Name</label><input id="f-name" value="${esc(d.name||'')}">
  ${auth.currentUser?'':`<label>Email</label><input id="f-mail" type="email" value="${esc(d.email||'')}"><label>Password (6+ characters) <a href="#" style="font-weight:400;float:right" onclick="event.preventDefault();tp('f-pw')">Show</a></label><input id="f-pw" type="password" value="${esc(d.pw||'')}">`}
  <div class="row"><div><label>Age</label><input id="f-age" type="number" min="18" max="40" value="${esc(d.age||'')}"></div>
  <div><label>Gender</label><select id="f-gender">${['Male','Female','Other'].map(g=>`<option ${d.gender===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
  <label>College</label><select id="f-college"><option value="">Select your college</option>${COLLEGES.map(c=>`<option ${d.college===c?'selected':''}>${c}</option>`).join('')}</select>
  <div class="row"><div><label>City</label><input id="f-city" value="${esc(d.city||'')}"></div><div><label>College ID</label><input id="f-cid" value="${esc(d.cid||'')}"></div></div>
  <label>About me (optional)</label><textarea id="f-about" maxlength="120" placeholder="One or two lines about you">${esc(d.about||'')}</textarea>
  <label>Pick your interests</label>${chips(d.interests,'togI')}
  <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:16px"><input type="checkbox" id="f-agree" style="width:auto;margin-top:3px"> <span>I am 18 or older and agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span></label><div class="err" id="err"></div><button class="btn" onclick="signup()">Join campus</button>
  ${auth.currentUser?'':`<button class="btn ghost" onclick="go('auth')">I already have an account</button>`}`}
function keep(){const g=i=>(document.getElementById(i)||{}).value||'';Object.assign(draft,{name:g('f-name').trim(),email:g('f-mail').trim(),pw:g('f-pw'),age:g('f-age'),gender:g('f-gender'),college:g('f-college').trim(),city:g('f-city').trim(),cid:g('f-cid').trim(),about:g('f-about').trim()})}
function togI(n){keep();const i=draft.interests.indexOf(n);i<0?draft.interests.push(n):draft.interests.splice(i,1);render()}
function pic(inp){const f=inp.files[0];if(!f)return;keep();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,120,120);draft.photo=c.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f)}

async function signup(){
  keep();const d=draft,e=document.getElementById('err'),has=!!auth.currentUser;
  if(!d.name||!d.age||!d.college||!d.city||!d.cid||(!has&&(!d.email||!d.pw))){e.textContent='Fill in all the fields.';return}
  if(parseInt(d.age)<18){e.textContent='UniSide is for students aged 18 or above.';return}
  if(!document.getElementById('f-agree').checked){e.textContent='Please accept the Terms and Privacy Policy.';return}
  if(!d.interests.length){e.textContent='Pick at least one interest to see squads.';return}
  try{creating=1;const uid=has?auth.currentUser.uid:(await createUserWithEmailAndPassword(auth,d.email,d.pw)).user.uid;
    const p={name:d.name,age:d.age,gender:d.gender||'Male',college:d.college,city:d.city,cid:d.cid,photo:d.photo,about:d.about||'',made:0,interests:d.interests};
    await setDoc(doc(db,'users',uid),p);U={...p,uid};creating=0;start();go(ls.get('intro')?'home':'intro')}catch(x){creating=0;e.textContent=errMsg(x)}
}
/* HOME */
function inTab(s,t){const n=Date.now();if(s.ts<n-2*H)return false;return t==='today'?sameDay(s.ts,n):!sameDay(s.ts,n)}
function allowed(s){const g=U.gender;return s.aud==='both'||(s.aud==='women'&&g==='Female')||(s.aud==='men'&&g==='Male')}
function vHome(){
  if(home==='people')return vPeople();
  const base=squads.filter(s=>s.members.includes(U.uid)||(allowed(s)&&(!only||U.interests.includes(s.act))));
  const cnt=t=>base.filter(s=>inTab(s,t)).length,list=base.filter(s=>inTab(s,tab)).sort((a,b)=>a.ts-b.ts);
  return hTop()+`<div class="sub2"><button class="chip ${tab==='today'?'on':''}" onclick="setTab('today')">Today (${cnt('today')})</button><button class="chip ${tab==='week'?'on':''}" onclick="setTab('week')">This week (${cnt('week')})</button><select onchange="setOnly(this.value==='1')" style="width:auto;padding:6px 10px;font-size:13px;margin-left:auto"><option value="1" ${only?'selected':''}>My interests</option><option value="0" ${!only?'selected':''}>All squads</option></select></div>`+(list.length?list.map(card).join(''):`<div class="empty">${tab==='today'?'Nothing planned for today.':'Nothing planned this week.'}<br>Create a squad or check the other tab.<br><button class="btn" onclick="go('create')">Create the first squad</button></div>`);
}
const setTab=t=>{tab=t;render()},setOnly=b=>{only=b;render()};
function card(s){
  const n=s.members.length,mine=s.creator===U.uid,mem=s.members.includes(U.uid),rq=outR.find(r=>r.sid===s.id);
  let act;
  if(mem)act=`<button class="btn sm alt" onclick="openChat('${s.id}')">Open chat</button>`;
  else if(rq)act=`<span class="tag">${rq.status==='pending'?'Request sent':rq.status==='accepted'?'You left':'Not accepted'}</span>`;
  else if(n>=s.need)act=`<span class="tag">Squad full</span>`;
  else act=`<button class="btn sm" onclick="join('${s.id}')">Ask to join</button>`;
  return `<div class="card"><div class="sq-h"><div class="emo">${EMO[s.act]||'👥'}</div><div><div class="sq-t">${esc(s.title)}</div><div class="meta">${fmt(s.ts)} · ${esc(s.place)}</div>${sb(s)}</div></div>
  <p class="meta" style="margin:10px 0 0">${esc(s.desc)}</p><p class="meta" style="margin:4px 0 0">👥 ${memNames(s)}</p><div class="bar"><i style="width:${Math.min(100,n/s.need*100)}%"></i></div>
  <div class="foot"><span class="tag">${n}/${s.need} joined${mine?' · your squad':' · by '+esc(s.creatorName)}${s.aud!=='both'?' · '+AUD[s.aud]:''}</span>${act}</div>${mine?`<div class="tag" style="margin-top:8px"><a href="#" onclick="event.preventDefault();editSq('${s.id}')">Edit</a> · <a href="#" style="color:var(--red)" onclick="event.preventDefault();cancelSq('${s.id}')">Cancel squad</a></div>`:`<div class="tag" style="margin-top:8px">${mem?`<a href="#" onclick="event.preventDefault();leaveSq('${s.id}')">Leave</a> · `:''}<a href="#" onclick="event.preventDefault();report('squad','${s.id}')">Report</a> · <a href="#" onclick="event.preventDefault();blockUser('${s.creator}')">Block</a></div>`}</div>`;
}
async function join(id){if(!tip())return;const s=sq(id);try{await setDoc(doc(db,'requests',id+'_'+U.uid),{sid:id,uid:U.uid,name:U.name,creator:s.creator,title:s.title,status:'pending'})}catch(e){toast('Could not send request. Try again.')}}
/* CREATE */
function vCreate(){
  return `<h1>Create squad</h1><p class="sub">Tell people what you're planning.</p>

function syncMeta(){if(!U)return;myChats().forEach(c=>{if(metaUn[c.id])return;metaUn[c.id]=onSnapshot(doc(db,'meta',c.id),d=>{meta[c.id]=d.data();refresh()},()=>{})})}
const chatDot=()=>myChats().some(c=>unread(c.id))?'<span class="dot" style="position:absolute;top:-4px;right:-4px;padding:4px"></span>':'';
function vChats(){const c=myChats();return `<div class="top"><h1>My chats</h1><button class="btn sm ghost" onclick="go('home')">Back</button></div>`+(c.length?c.map(x=>`<div class="card" style="cursor:pointer" onclick="${x.o?`openDm('${x.o}','${esc(x.t).replace(/&#39;/g,'')}')`:`openChat('${x.id}')`}"><div class="foot"><div><div class="sq-t">${esc(x.t)}</div><div class="meta">${x.sub}</div></div>${unread(x.id)?'<span class="dot" style="padding:5px"></span>':''}</div></div>`).join(''):'<div class="empty">No chats yet.<br>Join a squad or connect with someone.<br><button class="btn" onclick="go(\'home\')">Find a squad</button></div>')}
const INTRO=[['👥','Find your squad','Create or join plans for sports, study, movies and more at your campus.'],['🛍️','Connect and trade','Meet people with your interests and buy or sell books and gear.'],['🛡️','Stay safe','Meet in public places on campus, tell a friend, and use Report or Block anytime.']];
function vIntro(){const [e,t,d]=INTRO[introI];return `<div style="text-align:center;padding-top:12vh"><div style="font-size:64px">${e}</div><h1>${t}</h1><p class="sub">${d}</p><div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">${INTRO.map((_,i)=>`<span style="width:8px;height:8px;border-radius:50%;background:${i===introI?'var(--blue)':'var(--line)'}"></span>`).join('')}</div><button class="btn" onclick="introNext()">${introI<2?'Next':'Get started'}</button>${introI<2?'<button class="btn ghost" style="border:0" onclick="introDone()">Skip</button>':''}</div>`}
const introDone=()=>{ls.set('intro','1');introI=0;go('home')},introNext=()=>{introI<2?(introI++,render()):introDone()};
const tp=id=>{const i=document.getElementById(id);i.type=i.type==='password'?'text':'password'};
const tip=()=>{if(ls.get('tip'))return true;const ok=confirm('Safety tip: meet new people in public places on campus and tell a friend where you are going. Continue?');if(ok)ls.set('tip','1');return ok};
const badges=()=>{const m=U.made||0,b=[[1,'🏅 First squad'],[3,'⭐ Squad starter'],[10,'👑 Squad leader']].filter(x=>m>=x[0]);return b.length?`<div class="chips" style="margin-bottom:14px">${b.map(x=>`<span class="chip" style="background:var(--lime);color:#14182B;border-color:var(--lime)">${x[1]}</span>`).join('')}</div>`:''};
const memNames=s=>{const a=s.members.map(u=>(s.names||{})[u]).filter(Boolean);return esc(a.slice(0,3).join(', '))+(a.length>3?' +'+(a.length-3):'')};
const sb=s=>{const mn=(s.ts-Date.now())/6e4,left=s.need-s.members.length,t=[];if(mn<=0)t.push('Started');else if(mn<=180)t.push('Starts in '+(mn>=60?Math.round(mn/60)+' hr':Math.round(mn)+' min'));if(left===1)t.push('Only 1 spot left');else if(left===2)t.push('2 spots left');return t.length?`<div style="margin-top:4px">${t.map(x=>`<span class="tag" style="background:var(--lime);color:#14182B;border-radius:99px;padding:2px 8px;margin-right:6px">${x}</span>`).join('')}</div>`:''};
function showProf(u){pv=people.find(p=>p.uid===u);go('prof')}
function vProf(){const p=pv;if(!p)return '<div class="empty">Profile not found</div>';const r=inR.concat(outR).find(x=>x.id==='dm_'+pair(p.uid)),sh=shared(p);let act;
  if(r&&r.status==='accepted')act=`<button class="btn" onclick="openDm('${p.uid}')">Open chat</button>`;else if(r&&r.status==='pending')act=`<p class="tag" style="text-align:center">${r.uid===U.uid?'Request sent':'Wants to connect'}</p>`;else if(r)act='<p class="tag" style="text-align:center">Not accepted</p>';else act=`<button class="btn" onclick="connect('${p.uid}')">Connect</button>`;
  return `<button class="btn sm ghost" onclick="go('home')">Back</button><div style="text-align:center;margin:18px 0"><div style="display:flex;justify-content:center"><div style="transform:scale(1.8);margin:18px">${avatar(p)}</div></div><h1>${esc(p.name)}</h1><div class="meta">${esc(p.college)} · ${esc(p.city)}</div>${p.about?`<p style="margin:14px 0 0">${esc(p.about)}</p>`:''}</div><h2>Interests${sh.length?' ('+sh.length+' in common)':''}</h2><div class="chips">${(p.interests||[]).map(i=>`<span class="chip ${U.interests.includes(i)?'on':''}">${EMO[i]||''} ${esc(i)}</span>`).join('')}</div>${act}<p class="meta" style="text-align:center;margin-top:16px"><a href="#" onclick="event.preventDefault();report('user','${p.uid}')">Report</a> · <a href="#" onclick="event.preventDefault();blockUser('${p.uid}');go('home')">Block</a></p>`}
const editSq=id=>{editId=id;go('edit')};
function vEdit(){const s=sq(editId);if(!s)return '<div class="empty">Squad not found</div><button class="btn" onclick="go(\'home\')">Back</button>';return `<h1>Edit squad</h1><label>Title</label><input id="x-title" value="${esc(s.title)}"><label>Date and time</label><input id="x-when" type="datetime-local" value="${lt(s.ts)}" min="${lt(Date.now())}" max="${lt(Date.now()+7*D)}"><label>Place</label><input id="x-place" value="${esc(s.place)}"><label>People needed</label><input id="x-need" type="number" min="${s.members.length}" value="${s.need}"><label>Description</label><textarea id="x-desc">${esc(s.desc)}</textarea><div class="err" id="err"></div><button class="btn" onclick="saveSq()">Save</button><button class="btn ghost" onclick="go('home')">Cancel</button>`}
async function saveSq(){const s=sq(editId),g=i=>document.getElementById(i).value.trim(),e=document.getElementById('err'),ts=new Date(g('x-when')).getTime(),need=parseInt(g('x-need'));if(!g('x-title')||!g('x-place')||!ts||!need||need<s.members.length){e.textContent='Check title, time, place and people needed.';return}if(ts<Date.now()||ts>Date.now()+7*D+H){e.textContent='Pick a time within the next 7 days.';return}try{await updateDoc(doc(db,'squads',editId),{title:g('x-title'),place:g('x-place'),ts,wk:wk(ts),need,desc:g('x-desc')||'No description added.'});go('home');toast('Saved')}catch(x){e.textContent='Could not save. Try again.'}}
async function cancelSq(id){if(!confirm('Cancel this squad for everyone?'))return;try{await deleteDoc(doc(db,'squads',id));toast('Squad cancelled')}catch(e){toast('Could not cancel.')}}
async function leaveSq(id){const s=sq(id);if(!s||!confirm('Leave this squad?'))return;try{await updateDoc(doc(db,'squads',id),{members:s.members.filter(x=>x!==U.uid),['names.'+U.uid]:deleteField()});toast('You left the squad')}catch(e){toast('Could not leave.')}}
function itemPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);spic=c.toDataURL('image/jpeg',.5);const p=document.getElementById('s-prev');p.src=spic;p.style.display='block'};im.src=r.result};r.readAsDataURL(f)}
Object.assign(window,{showProf,editSq,saveSq,cancelSq,leaveSq,itemPhoto,tp,introNext,introDone,report,blockUser,unblockAll,feedback,invite,installApp,resetPw,delAcc,toast,setAt,setPhoto,saveProfile,startEdit,cancelEdit,togEdit,loadPeople,setHome,setPOnly,connect,openDm,sell,sold,delItem,setCat,go,togI,pic,signup,login,setTab,setOnly,join,create,decide,openChat,closeChat,send,togMine,logout,render,draft});
render();
</script></body></html>
