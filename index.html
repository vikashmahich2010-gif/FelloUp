const sb=s=>{const mn=(s.ts-Date.now())/6e4,left=s.need-s.members.length,t=[];if(mn<=0)t.push('Started');else if(mn<=180)t.push('Starts in '+(mn>=60?Math.round(mn/60)+' hr':Math.round(mn)+' min'));if(left===1)t.push('Only 1 spot left');else if(left===2)t.push('2 spots left');return t.length?`<div style="margin-top:4px">${t.map(x=>`<span class="tag" style="background:var(--lime);color:#14182B;border-radius:99px;padding:2px 8px;margin-right:6px">${x}</span>`).join('')}</div>`:''};
function showProf(u){pv=people.find(p=>p.uid===u);go('prof')}
function vProf(){const p=pv;if(!p)return '<div class="empty">Profile not found</div>';const r=inR.concat(outR).find(x=>x.id==='dm_'+pair(p.uid)),sh=shared(p);let act;
  if(r&&r.status==='accepted')act=`<button class="btn" onclick="openDm('${p.uid}')">Open chat</button>`;else if(r&&r.status==='pending')act=`<p class="tag" style="text-align:center">${r.uid===U.uid?'Request sent':'Wants to connect'}</p>`;else if(r)act='<p class="tag" style="text-align:center">Not accepted</p>';else act=`<button class="btn" onclick="connect('${p.uid}',this)">Connect</button>`;
  return `<button class="btn sm ghost" onclick="back()">Back</button><div style="text-align:center;margin:18px 0"><div style="display:flex;justify-content:center"><div style="transform:scale(1.8);margin:18px">${avatar(p)}</div></div><h1>${esc(p.name)}</h1><div class="meta">${esc(p.college)} · ${esc(p.city)}</div>${p.about?`<p style="margin:14px 0 0">${esc(p.about)}</p>`:''}</div><h2>Interests${sh.length?' ('+sh.length+' in common)':''}</h2><div class="chips">${(p.interests||[]).map(i=>`<span class="chip ${U.interests.includes(i)?'on':''}">${EMO[i]||''} ${esc(i)}</span>`).join('')}</div>${act}<p class="meta" style="text-align:center;margin-top:16px"><a href="#" onclick="event.preventDefault();report('user','${p.uid}')">Report</a> · <a href="#" onclick="event.preventDefault();blockUser('${p.uid}');back()">Block</a></p>`}
const editSq=id=>{editId=id;go('edit')};
function vEdit(){const s=sq(editId);if(!s)return '<div class="empty">Squad not found</div><button class="btn" onclick="go(\'home\')">Back</button>';return `<h1>Edit squad</h1><label>Title</label><input id="x-title" value="${esc(s.title)}"><label>Date and time</label><input id="x-when" type="datetime-local" value="${lt(s.ts)}" min="${lt(Date.now())}" max="${lt(Date.now()+7*D)}"><label>Place</label><input id="x-place" value="${esc(s.place)}"><label>People needed</label><input id="x-need" type="number" min="${s.members.length}" value="${s.need}"><label>Description</label><textarea id="x-desc">${esc(s.desc)}</textarea><div class="err" id="err"></div><button class="btn" onclick="saveSq()">Save</button><button class="btn ghost" onclick="back()">Cancel</button>`}
async function saveSq(){const s=sq(editId),g=i=>document.getElementById(i).value.trim(),e=document.getElementById('err'),ts=new Date(g('x-when')).getTime(),need=parseInt(g('x-need'));if(!g('x-title')||!g('x-place')||!ts||!need||need<s.members.length){e.textContent='Check title, time, place and people needed.';return}if(ts<Date.now()||ts>Date.now()+7*D+H){e.textContent='Pick a time within the next 7 days.';return}try{await updateDoc(doc(db,'squads',editId),{title:g('x-title'),place:g('x-place'),ts,wk:wk(ts),need,desc:g('x-desc')||'No description added.'});back();toast('Saved')}catch(x){e.textContent='Could not save. Try again.'}}
function cancelSq(id){sheet('Cancel this squad?','It will be removed for everyone.',[{l:'Cancel squad',c:'no',f:()=>doCancel(id)}])}
async function doCancel(id){try{await deleteDoc(doc(db,'squads',id));toast('Squad cancelled')}catch(e){toast('Could not cancel.')}}
function leaveSq(id){if(!sq(id))return;sheet('Leave this squad?','You will not be able to rejoin it later.',[{l:'Leave squad',c:'no',f:()=>doLeave(id)}])}
async function doLeave(id){const s=sq(id);try{await updateDoc(doc(db,'squads',id),{members:s.members.filter(x=>x!==U.uid),['names.'+U.uid]:deleteField()});toast('You left the squad')}catch(e){toast('Could not leave.')}}
function itemPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);spic=c.toDataURL('image/jpeg',.5);const p=document.getElementById('s-prev');p.src=spic;p.style.display='block'};im.src=r.result};r.readAsDataURL(f)}
Object.assign(window,{back,showSq,shareSq,setCf,setCfq,stepN,showProf,editSq,saveSq,cancelSq,leaveSq,itemPhoto,tp,introNext,introDone,report,blockUser,unblockAll,feedback,invite,installApp,resetPw,delAcc,toast,setAt,setPhoto,saveProfile,startEdit,cancelEdit,togEdit,loadPeople,setHome,setPOnly,connect,openDm,sell,sold,delItem,setCat,go,togI,pic,signup,login,setTab,setOnly,join,create,decide,openChat,closeChat,send,togMine,logout,render,draft});
render();
